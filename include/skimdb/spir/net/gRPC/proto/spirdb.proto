// spirdb.proto
syntax = "proto3";

package skim.spir;

import "google/protobuf/empty.proto";

message DbParametersReply {
  uint64 k = 1;
  uint64 s = 2;
  uint64 t = 3;
}

message DbMetadataReply {
  bytes index               = 1;
  repeated string labels    = 2;
}

message SpirParametersReply {
  uint64 n          = 1;
  double sigma      = 2;

  // std::size_t
  uint64 log_p      = 3;
  uint64 log_q      = 4;

  // std::size_t
  uint64 batch_size = 5;

  uint32 block_size = 6;
  uint64 rle_blocks = 7;
  uint64 sqrt_N     = 8;

  uint64 seed       = 9;
}

message SpirHintRow {
  repeated uint64 hint_row = 1;
}

message QueryRequest {
  repeated uint64 qu = 1;
}

message QueryReply {
  repeated uint64 ans = 1;
}

service SpirDB {
  rpc GetDbParameters(google.protobuf.Empty) returns (DbParametersReply);
  rpc GetDbMetadata(google.protobuf.Empty) returns (DbMetadataReply);
  rpc GetSpirParameters(google.protobuf.Empty) returns (SpirParametersReply);
  rpc GetSpirHint(google.protobuf.Empty) returns (stream SpirHintRow);

  rpc Query(QueryRequest) returns (QueryReply);
  rpc BatchQuery(QueryRequest) returns (QueryReply);
}
